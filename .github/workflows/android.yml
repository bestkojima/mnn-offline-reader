name: Android build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;3.31.6'
      - name: Prepare English dictionary
        run: bash scripts/prepare_assets.sh
      - name: Test resource scripts
        run: |
          python3 scripts/test_dictionary.py
          python3 scripts/test_kokoro_assets.py
      - name: Build APK and run host checks
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
